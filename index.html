<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pencarian NISN - SMP Negeri 3 Batam</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font -->
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap');
        body { font-family: 'Poppins', sans-serif; }
        .glass-effect {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
    </style>
</head>
<body class="bg-gradient-to-br from-blue-50 to-indigo-100 min-h-screen flex items-center justify-center p-4">

    <div class="max-w-md w-full glass-effect rounded-2xl shadow-xl overflow-hidden">
        <!-- Header -->
        <div class="bg-blue-600 p-6 text-center">
            <h1 class="text-2xl font-bold text-white">Pencarian NISN</h1>
            <p class="text-blue-100 text-sm mt-1">SMP Negeri 3 Batam</p>
        </div>

        <div class="p-6 space-y-6">
            
            <!-- Bagian Pencarian -->
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-2">Cari Berdasarkan Nama</label>
                <div class="relative">
                    <input type="text" id="searchName" placeholder="Masukkan nama siswa..." 
                           class="w-full pl-10 pr-4 py-3 rounded-lg border border-gray-300 focus:ring-2 focus:ring-blue-500 focus:border-transparent outline-none transition">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 text-gray-400 absolute left-3 top-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
                    </svg>
                </div>
            </div>

            <!-- Hasil Pencarian -->
            <div id="resultContainer" class="space-y-3 max-h-60 overflow-y-auto pr-1">
                <p class="text-center text-sm text-gray-500 italic">Ketik nama untuk mencari...</p>
            </div>

        </div>
        
        <div class="bg-gray-50 p-4 text-center text-xs text-gray-400">
            &copy; 2026 SMP Negeri 3 Batam
        </div>
    </div>

    <!-- Memuat data dari file eksternal -->
    <script src="data.js"></script>

    <script>
        const searchInput = document.getElementById('searchName');
        const resultContainer = document.getElementById('resultContainer');

        // Event Listener untuk Pencarian
        searchInput.addEventListener('input', function(e) {
            const keyword = e.target.value.toUpperCase().trim();
            resultContainer.innerHTML = '';

            if(keyword.length === 0) {
                resultContainer.innerHTML = '<p class="text-center text-sm text-gray-500 italic">Ketik nama untuk mencari...</p>';
                return;
            }

            // Filter data berdasarkan nama
            const results = studentData.filter(student => 
                student.nama.toUpperCase().includes(keyword)
            );

            if(results.length === 0) {
                resultContainer.innerHTML = `
                    <div class="text-center py-4 text-gray-500">
                        <p>Data tidak ditemukan.</p>
                        <p class="text-xs">Coba cek ejaan nama.</p>
                    </div>
                `;
            } else {
                results.forEach(student => {
                    const card = document.createElement('div');
                    card.className = "bg-white p-3 rounded-lg shadow-sm border border-gray-100 hover:shadow-md transition flex justify-between items-center";
                    card.innerHTML = `
                        <div>
                            <p class="font-semibold text-gray-800">${student.nama}</p>
                            <p class="text-xs text-gray-500">NISN</p>
                        </div>
                        <div class="bg-blue-100 text-blue-800 px-3 py-1 rounded-full text-sm font-mono font-bold">
                            ${student.nisn}
                        </div>
                    `;
                    resultContainer.appendChild(card);
                });
            }
        });
    </script>
</body>
</html>
