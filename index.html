        body {

            background: linear-gradient(135deg, #0f172a 0%, #1e3a8a 100%);

            color: white;
        }
        .glass-card {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
        }
        .gold-text {

        }
        .btn-search {
            background: linear-gradient(90deg, #fbbf24 0%, #d97706 100%);

        }
        .btn-search:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 15px rgba(251, 191, 36, 0.4);
        }
        .result-card {
            animation: fadeIn 0.5s ease-out;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>

        function searchStudent() {
            const input = document.getElementById('nisnInput').value.trim();
            const resultArea = document.getElementById('resultArea');
            
            if (!input) {
                alert("Silakan masukkan NISN terlebih dahulu!");
                return;
            }

            // Mencari siswa berdasarkan NISN
            const student = students.find(s => s.NISN === input);

            if (student) {
                resultArea.innerHTML = `
                    <div class="glass-card rounded-2xl p-6 result-card border-l-4 border-yellow-400">
                        <div class="flex items-center justify-between mb-4">
                            <h2 class="text-xl font-bold text-white">${student["Nama Siswa"]}</h2>
                            <span class="bg-green-500 text-white text-xs font-bold px-3 py-1 rounded-full">LULUS</span>
                        </div>
                        <div class="space-y-3 text-sm text-gray-200">
                            <div class="flex justify-between border-b border-white/10 pb-2">
                                <span>NISN</span>
                                <span class="font-mono font-bold">${student.NISN}</span>
                            </div>
                            <div class="flex justify-between border-b border-white/10 pb-2">
                                <span>Kelas</span>
                                <span class="font-bold">${student.KELAS}</span>
                            </div>
                            <div class="flex justify-between pt-1">
                                <span>Status Kelulusan</span>
                                <span class="font-bold text-yellow-400">${student.Ketarangan}</span>
                            </div>
                        </div>
                        <div class="mt-6 text-center">
                            <p class="text-xs text-gray-400 italic">"Selamat! Teruslah berprestasi."</p>
                        </div>
                    </div>
                `;
                resultArea.classList.remove('hidden');
            } else {
                resultArea.innerHTML = `
                    <div class="glass-card rounded-2xl p-6 result-card text-center border-l-4 border-red-500">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-12 w-12 mx-auto text-red-400 mb-3" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />

                        <h3 class="text-lg font-bold text-white mb-1">Data Tidak Ditemukan</h3>

                    </div>
                `;
                resultArea.classList.remove('hidden');
            }
        }

        // Allow Enter key to trigger search
        document.getElementById('nisnInput').addEventListener('keypress', function (e) {
            if (e.key === 'Enter') {
                searchStudent();
            }
        });
    </script>
